name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Generate .htaccess from redirects
        run: node scripts/gen-htaccess.mjs

      - name: Verify export
        run: node scripts/verify-export.mjs

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret HOSTINGER_SSH_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 82.25.125.86 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy out/ to Hostinger (rsync over SSH)
        run: |
          rsync -az --delete --exclude='.private' --stats \
            -e "ssh -p 65002 -o BatchMode=yes -o ConnectTimeout=20" \
            out/ u830179528@82.25.125.86:domains/wildranktechnologies.com/public_html/
