name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Generate .htaccess from redirects
        run: node scripts/gen-htaccess.mjs

      - name: Verify export
        run: node scripts/verify-export.mjs

      - name: Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: 82.25.125.86
          username: u830179528
          port: 65002
          ssh_private_key: ${{ secrets.HOSTINGER_SSH_KEY }}
          local_path: './out/*'
          remote_path: /home/u830179528/domains/wildranktechnologies.com/public_html
          sftp_only: true
          delete_remote_files: false
